<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0b">
<title>xusage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- skip -->
<a class="skip" href="#panel">Skip to panel</a>

<!-- ── topbar ─────────────────────────────────────────────── -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-word">xusage</span>
  </div>

  <div class="topbar-right">
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>

<!-- ── shell: rail + panel ───────────────────────────────── -->
<div class="shell">

  <!-- rail -->
  <nav class="rail" id="rail" aria-label="views">
    <div class="rail-group">
      <span class="rail-label">summary</span>
      <button class="rail-item active" data-route="overview">
        <span>Overview</span>
      </button>
      <button class="rail-item" data-route="timeline">
        <span>Timeline</span>
      </button>
    </div>
    <div class="rail-group">
      <span class="rail-label">breakdown</span>
      <button class="rail-item" data-route="models">
        <span>Models</span>
      </button>
      <button class="rail-item" data-route="agents">
        <span>Agents</span>
      </button>
    </div>
    <div class="rail-group">
      <span class="rail-label">monitor</span>
      <button class="rail-item" data-route="live">
        <span>Live</span>
      </button>
    </div>

    <div class="rail-foot">
      <div class="rail-stat">
        <span class="rail-stat-key">window</span>
        <span class="rail-stat-val" id="rail-window">7d</span>
      </div>
      <div class="rail-stat">
        <span class="rail-stat-key">updated</span>
        <span class="rail-stat-val" id="rail-updated">—</span>
      </div>
    </div>
  </nav>

  <!-- panel -->
  <main class="panel" id="panel">

    <!-- controls -->
    <div class="controls">
      <div class="seg" role="group" aria-label="range" id="seg-range">
        <button data-range="1d">1d</button>
        <button data-range="7d" class="active">7d</button>
        <button data-range="30d">30d</button>
        <button data-range="90d">90d</button>
        <button data-range="all">all</button>
      </div>
      <div class="seg" role="group" aria-label="metric" id="seg-metric">
        <button data-metric="tokens" class="active">tokens</button>
        <button data-metric="cost">$ cost</button>
        <button data-metric="calls">calls</button>
      </div>
      <button class="btn" id="export-btn">Export CSV</button>
    </div>

    <!-- view mount -->
    <section class="view" id="view"></section>

  </main>
</div>

<!-- toast port -->
<div class="toast" id="toast" role="status"></div>

<script src="/js/app.js" defer></script>
</body>
</html>
